<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trackr</title>
    <script>
      // SPA redirect: encode the path into a query param and redirect to index
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
